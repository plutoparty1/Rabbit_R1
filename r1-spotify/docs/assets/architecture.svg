<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc"><title id="title">R1 Spotify data flow</title><desc id="desc">Device uses PKCE with Spotify, controls an existing playback device, and requests lyrics from Bugs via a same-origin Worker or from LRCLIB and lyrics.ovh.</desc><rect width="1200" height="300" rx="24" fill="#111b23"/><g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle"><g fill="#1c302b" stroke="#436150"><rect x="35" y="90" width="220" height="120" rx="16"/><rect x="425" y="30" width="300" height="90" rx="16"/><rect x="425" y="180" width="300" height="90" rx="16"/><rect x="895" y="30" width="270" height="90" rx="16"/><rect x="895" y="180" width="270" height="90" rx="16"/></g><g fill="#f3fff7" font-size="23"><text x="145" y="140">rabbit r1</text><text x="575" y="68">Spotify Web API</text><text x="575" y="219">Lyrics lookup</text><text x="1030" y="68">Phone / PC / speaker</text><text x="1030" y="219">Bugs / LRCLIB / ovh</text></g><g fill="#a1bbac" font-size="15"><text x="145" y="169">Controls + device storage</text><text x="575" y="96">OAuth PKCE + playback control</text><text x="575" y="246">Bugs via same-origin Worker</text><text x="1030" y="96">Audio plays here</text><text x="1030" y="246">Track metadata only</text></g><g fill="none" stroke="#a4ffba" stroke-width="2"><path d="M255 125 425 75m-12-5 12 5-9 10M725 75h170m-12-7 12 7-12 7M255 175 425 225m-9-10 9 10-12 5M725 225h170m-12-7 12 7-12 7"/></g></g></svg>
